<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="application-name" content="Parallel Reader">
    <title>Параллельный Ридер</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e2e8f0;
            height: 100%;
            overflow: hidden;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            gap: 10px;
        }
        .header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: linear-gradient(135deg, #4c1d95, #1e3a8a);
            border-radius: 12px;
        }
        .header h1 {
            font-size: 1.1rem;
            color: #e9d5ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .save-indicator {
            font-size: 0.7rem;
            color: #86efac;
            display: none;
        }
        .header .save-indicator.active { display: inline; }

        /* Панель управления */
        .controls {
            flex-shrink: 0;
            background: #16213e;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #2d3748;
        }
        .controls-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.15s;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            color: white;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #4b5563 !important; cursor: not-allowed; opacity: 0.6; }
        .btn-file { background: #7c3aed; }
        .btn-play { background: #16a34a; }
        .btn-pause { background: #d97706; }
        .btn-stop { background: #dc2626; }

        .file-input {
            color: #c4b5fd;
            font-size: 12px;
            max-width: 140px;
            padding: 6px;
        }
        .rate-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            margin-left: auto;
        }
        .rate-control input[type=range] { width: 70px; }

        .status {
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
            margin-top: 8px;
            display: none;
            font-size: 13px;
        }
        .status.info { background: #1e3a5f; color: #60a5fa; display: block; }
        .status.success { background: #14532d; color: #4ade80; display: block; }
        .status.error { background: #450a0a; color: #f87171; display: block; }

        .word-info {
            background: #14532d;
            border: 1px solid #22c55e;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 8px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
        }
        .word-info.active { display: flex; }
        .word-info .btn { padding: 6px 12px; font-size: 12px; min-height: 32px; }

        .saved-banner {
            background: #1e3a5f;
            border: 1px solid #3b82f6;
            padding: 8px 12px;
            border-radius: 8px;
            display: none;
            font-size: 12px;
            color: #93c5fd;
        }
        .saved-banner.active { display: block; }

        /* Область текста */
        .text-area {
            flex: 1;
            display: flex;
            gap: 10px;
            min-height: 0;
        }
        .text-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            border: 1px solid #2d3748;
            border-radius: 12px;
            background: #16213e;
            line-height: 1.9;
            font-size: 16px;
            position: relative;
        }
        .text-container .label {
            position: sticky;
            top: -14px;
            background: #16213e;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #a78bfa;
            margin: -14px -14px 10px -14px;
            border-bottom: 1px solid #2d3748;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .word {
            display: inline;
            padding: 1px 2px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .word:hover { background-color: #374151; }

        /* 🟢 Зелёная подсветка при клике */
        .word.clicked {
            background-color: rgba(34, 197, 94, 0.45) !important;
            color: #dcfce7 !important;
            font-weight: 700;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
            border-radius: 4px;
        }

        /* 🟡 Жёлтая подсветка при чтении */
        .word.active {
            background-color: rgba(250, 204, 21, 0.7) !important;
            color: #000 !important;
            font-weight: 600;
        }

        /* 🔵 Прочитанные */
        .word.read {
            background-color: rgba(250, 204, 21, 0.15);
            color: #94a3b8;
        }

        .sentence-wrap { display: inline; margin-right: 4px; }

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
        .welcome .emoji { font-size: 4rem; margin-bottom: 16px; }
        .welcome h2 { color: #a78bfa; font-size: 1.3rem; margin-bottom: 8px; }

        @media (max-width: 768px) {
            .text-area { flex-direction: column; }
            .text-container { font-size: 15px; }
            .btn { padding: 8px 10px; font-size: 12px; min-height: 40px; }
            .rate-control { margin-left: 0; width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>📖 Parallel Reader <span id="saveIndicator" class="save-indicator">💾 сохранено</span></h1>
        <div id="savedBanner" class="saved-banner"></div>
    </div>

    <div class="controls">
        <div class="controls-row">
            <input type="file" id="textFile" accept=".pdf,.epub,.fb2,.txt" class="file-input">
            <button class="btn btn-file" id="translateBtn" onclick="processTextFile()">📄 Загрузить</button>
            <button class="btn btn-play" onclick="startSpeech()">▶ Играть</button>
            <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">⏸ Пауза</button>
            <button class="btn btn-stop" onclick="stopSpeech()">⏹ Стоп</button>
            <div class="rate-control">
                <span>🔊</span>
                <input type="range" id="speechRate" min="0.3" max="1.5" step="0.05" value="0.85" oninput="changeRate(this.value)">
                <span id="rateValue">0.85x</span>
            </div>
        </div>
        <div id="status" class="status"></div>
        <div id="wordInfo" class="word-info">
            <span id="wordInfoText"></span>
            <button class="btn btn-play" onclick="resumeFromWord()">▶ Продолжить</button>
        </div>
    </div>

    <div id="welcomeScreen" class="welcome">
        <div class="emoji">📖</div>
        <h2>Параллельный Ридер</h2>
        <p>Загрузите файл (PDF, EPUB, FB2 или TXT) для начала работы</p>
        <p style="margin-top:8px; font-size:12px;">💡 Позиция чтения сохраняется автоматически</p>
    </div>

    <div id="output" class="text-area" style="display:none;">
        <div class="text-container" id="originalContainer">
            <div class="label">
                <span>🇬🇧 Оригинал (EN)</span>
                <span id="progressEN" style="color:#60a5fa;"></span>
            </div>
            <div id="originalContent"></div>
        </div>
        <div class="text-container" id="translatedContainer">
            <div class="label">
                <span>🇷🇺 Перевод (RU)</span>
                <span id="progressRU" style="color:#4ade80;"></span>
            </div>
            <div id="translatedContent"></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // ===== СОСТОЯНИЕ =====
    let sentencesEN = [];
    let sentencesRU = [];
    let synth = window.speechSynthesis;
    let utterance = null;
    let isSpeaking = false;
    let isTranslating = false;
    let currentSentenceIndex = 0;
    let clickedWordData = null;
    let currentFileName = '';

    const STORAGE_KEY = 'parallel_reader_position_v2';
    const delay = ms => new Promise(res => setTimeout(res, ms));

    // ===== СОХРАНЕНИЕ ПОЗИЦИИ =====
    window.addEventListener('load', loadSavedPosition);
    window.addEventListener('beforeunload', savePosition);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) savePosition();
    });

    function savePosition() {
        if (currentFileName && sentencesEN.length > 0) {
            const pos = {
                fileName: currentFileName,
                sentenceIndex: currentSentenceIndex,
                timestamp: Date.now()
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(pos));
                flashSaveIndicator();
            } catch(e) {}
        }
    }

    function flashSaveIndicator() {
        const el = document.getElementById('saveIndicator');
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 1500);
    }

    function loadSavedPosition() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const pos = JSON.parse(saved);
                const banner = document.getElementById('savedBanner');
                const date = new Date(pos.timestamp).toLocaleString('ru');
                banner.innerHTML = `📌 Сохранено: <b>${pos.fileName}</b> — предложение #${pos.sentenceIndex + 1} (${date})`;
                banner.classList.add('active');
            }
        } catch(e) {}
    }

    // ===== СКОРОСТЬ =====
    function changeRate(val) {
        document.getElementById('rateValue').textContent = parseFloat(val).toFixed(2) + 'x';
        if (isSpeaking && synth.speaking && !synth.paused) {
            synth.cancel();
            speakNext();
        }
    }

    // ===== ЗАГРУЗКА ФАЙЛА =====
    async function processTextFile() {
        if (isTranslating) return;
        const fileInput = document.getElementById('textFile');
        const file = fileInput.files[0];
        if (!file) {
            updateStatus('Выберите файл (PDF, EPUB, FB2 или TXT).', 'error');
            return;
        }

        stopSpeech();
        isTranslating = true;
        currentFileName = file.name;
        document.getElementById('translateBtn').disabled = true;

        const ext = file.name.split('.').pop().toLowerCase();
        updateStatus(`Извлечение текста: ${file.name}...`, 'info');

        try {
            let text = '';
            if (ext === 'pdf') text = await readPdf(file);
            else if (ext === 'epub') text = await readEpub(file);
            else if (ext === 'fb2') text = await readFb2(file);
            else if (ext === 'txt') text = await file.text();
            else throw new Error('Неподдерживаемый формат.');

            if (!text.trim()) throw new Error('Файл пуст.');

            // Проверяем сохранённую позицию
            let startIndex = 0;
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (saved && saved.fileName === file.name) {
                    startIndex = Math.min(saved.sentenceIndex, sentencesEN.length - 1);
                    updateStatus(`📌 Продолжаем с предложения #${startIndex + 1}`, 'info');
                }
            } catch(e) {}

            updateStatus('Подготовка и перевод текста...', 'info');
            await processAndTranslateFull(text, startIndex);
        } catch (err) {
            updateStatus(`Ошибка: ${err.message}`, 'error');
        } finally {
            isTranslating = false;
            document.getElementById('translateBtn').disabled = false;
        }
    }

    async function readPdf(file) {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        let text = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(item => item.str).join(' ') + ' ';
        }
        return text;
    }

    async function readEpub(file) {
        // Простая обработка EPUB через JSZip
        if (!window.JSZip) {
            await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
        }
        const buf = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(buf);
        let text = '';
        const files = Object.keys(zip.files).filter(f => f.endsWith('.html') || f.endsWith('.xhtml'));
        for (const f of files) {
            const content = await zip.files[f].async('string');
            const doc = new DOMParser().parseFromString(content, 'application/xhtml+xml');
            text += (doc.body ? doc.body.textContent : '') + ' ';
        }
        return text;
    }

    async function readFb2(file) {
        const text = await file.text();
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        const body = xml.querySelector('body');
        return body ? body.textContent : '';
    }

    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    // ===== ПЕРЕВОД =====
    async function fetchTranslation(text, retries = 3) {
        if (!text.trim()) return '';
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
        for (let a = 0; a <= retries; a++) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data[0]) return data[0].map(i => i[0]).join('');
                }
            } catch(e) {
                if (a === retries) return text;
                await delay(300 * (a + 1));
            }
        }
        return text;
    }

    async function processAndTranslateFull(fullText, startIndex = 0) {
        const cleaned = fullText.replace(/\s+/g, ' ').trim();
        sentencesEN = cleaned.match(/[^.!?]+[.!?]+/g) || [cleaned];
        sentencesRU = new Array(sentencesEN.length).fill('');
        currentSentenceIndex = startIndex;

        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('output').style.display = 'flex';

        renderBaseText();
        updateStatus(`Загружено ${sentencesEN.length} предложений. Перевод...`, 'info');

        let batch = [], indices = [], batchLen = 0;
        for (let i = 0; i < sentencesEN.length; i++) {
            const s = sentencesEN[i].trim();
            batch.push(s);
            indices.push(i);
            batchLen += s.length;

            if (batchLen >= 200 || i === sentencesEN.length - 1) {
                const combined = batch.join(' ||| ');
                const translated = await fetchTranslation(combined);
                const parts = translated.split('|||');
                for (let j = 0; j < indices.length; j++) {
                    const idx = indices[j];
                    sentencesRU[idx] = parts[j] ? parts[j].trim() : sentencesEN[idx];
                    updateSentenceRU(idx, sentencesRU[idx]);
                }
                const pct = Math.round(((i + 1) / sentencesEN.length) * 100);
                updateProgress(pct);
                updateStatus(`Переведено ${pct}%`, 'info');
                batch = []; indices = []; batchLen = 0;
                await delay(80);
            }
        }

        if (startIndex > 0) {
            for (let i = 0; i < startIndex; i++) markSentenceAsRead(i);
        }

        updateStatus('✅ Перевод завершён!', 'success');
        document.getElementById('savedBanner').classList.remove('active');
    }

    function updateProgress(pct) {
        document.getElementById('progressRU').textContent = `${pct}%`;
    }

    // ===== РЕНДЕР =====
    function renderBaseText() {
        const origEl = document.getElementById('originalContent');
        const transEl = document.getElementById('translatedContent');
        origEl.innerHTML = '';
        transEl.innerHTML = '';

        sentencesEN.forEach((sent, sIdx) => {
            const span = document.createElement('span');
            span.className = 'sentence-wrap';
            span.id = `sent-en-${sIdx}`;

            sent.trim().split(/\s+/).forEach((w, wIdx) => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word';
                wordSpan.dataset.sidx = sIdx;
                wordSpan.dataset.widx = wIdx;
                wordSpan.textContent = w + ' ';
                wordSpan.onclick = () => onWordClick(sIdx, wIdx);
                span.appendChild(wordSpan);
            });
            origEl.appendChild(span);

            const ruSpan = document.createElement('span');
            ruSpan.className = 'sentence-wrap';
            ruSpan.id = `sent-ru-${sIdx}`;
            transEl.appendChild(ruSpan);
        });
    }

    function updateSentenceRU(sIdx, textRU) {
        const el = document.getElementById(`sent-ru-${sIdx}`);
        if (!el) return;
        el.innerHTML = '';
        const words = textRU.trim().split(/\s+/);

        words.forEach((w, wIdx) => {
            const span = document.createElement('span');
            span.className = 'word';
            span.dataset.sidx = sIdx;
            span.dataset.widx = wIdx;
            span.textContent = w + ' ';
            if (sIdx < currentSentenceIndex) span.classList.add('read');
            el.appendChild(span);
        });
    }

    // ===== 🟢 КЛИК ПО СЛОВУ =====
    function onWordClick(sIdx, wIdx) {
        // 1. Остановить чтение
        stopSpeech();

        // 2. Убрать предыдущую зелёную подсветку
        document.querySelectorAll('.word.clicked').forEach(el => el.classList.remove('clicked'));

        // 3. Подсветить нажатое слово в EN
        const enWord = document.querySelector(`#sent-en-${sIdx} .word[data-widx="${wIdx}"]`);
        if (enWord) {
            enWord.classList.add('clicked');
            enWord.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 4. Подсветить соответствующее слово в RU
        const enWords = sentencesEN[sIdx]?.trim().split(/\s+/) || [];
        const ruContainer = document.getElementById(`sent-ru-${sIdx}`);
        if (ruContainer) {
            const ruWords = ruContainer.querySelectorAll('.word');
            if (ruWords.length > 0) {
                const ratio = enWords.length > 1 ? wIdx / (enWords.length - 1) : 0;
                const ruIdx = Math.min(Math.round(ratio * (ruWords.length - 1)), ruWords.length - 1);
                ruWords[ruIdx].classList.add('clicked');
                ruWords[ruIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 5. Сохранить данные
        clickedWordData = { sIdx, wIdx };
        currentSentenceIndex = sIdx;

        // 6. Показать инфо-панель
        const wordInfo = document.getElementById('wordInfo');
        const wordText = document.getElementById('wordInfoText');
        wordText.innerHTML = `🟢 <b>"${enWords[wIdx]}"</b> — предложение ${sIdx + 1}`;
        wordInfo.classList.add('active');

        // 7. Сохранить позицию
        savePosition();
        updateStatus(`⏹ Остановлено на слове: "${enWords[wIdx]}"`, 'info');
    }

    function resumeFromWord() {
        clickedWordData = null;
        document.querySelectorAll('.word.clicked').forEach(el => el.classList.remove('clicked'));
        document.getElementById('wordInfo').classList.remove('active');
        isSpeaking = true;
        speakNext();
    }

    // ===== ОЗВУЧИВАНИЕ =====
    function startSpeech() {
        if (sentencesEN.length === 0) {
            updateStatus('Сначала загрузите файл.', 'error');
            return;
        }
        if (synth.paused) {
            synth.resume();
            document.getElementById('pauseBtn').textContent = '⏸ Пауза';
            return;
        }
        stopSpeech();
        isSpeaking = true;
        speakNext();
    }

    function speakNext() {
        if (currentSentenceIndex >= sentencesEN.length || !isSpeaking) {
            stopSpeech();
            updateStatus('✅ Чтение завершено.', 'success');
            return;
        }

        const text = sentencesEN[currentSentenceIndex];
        utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = parseFloat(document.getElementById('speechRate').value);

        utterance.onend = () => {
            markSentenceAsRead(currentSentenceIndex);
            currentSentenceIndex++;
            savePosition();
            speakNext();
        };
        utterance.onerror = () => {
            currentSentenceIndex++;
            speakNext();
        };

        synth.speak(utterance);
    }

    function togglePause() {
        if (!isSpeaking) return;
        const btn = document.getElementById('pauseBtn');
        if (synth.speaking && !synth.paused) {
            synth.pause();
            btn.textContent = '▶ Играть';
            savePosition();
        } else if (synth.paused) {
            synth.resume();
            btn.textContent = '⏸ Пауза';
        }
    }

    function markSentenceAsRead(sIdx) {
        document.querySelectorAll(`#sent-en-${sIdx} .word`).forEach(el => {
            el.classList.remove('active');
            el.classList.add('read');
        });
        document.querySelectorAll(`#sent-ru-${sIdx} .word`).forEach(el => {
            el.classList.remove('active', 'clicked');
            el.classList.add('read');
        });
    }

    function stopSpeech() {
        isSpeaking = false;
        if (synth.speaking || synth.paused) synth.cancel();
        document.getElementById('pauseBtn').textContent = '⏸ Пауза';
        savePosition(); // 💾 Сохраняем позицию
    }

    function updateStatus(msg, type) {
        const el = document.getElementById('status');
        el.textContent = msg;
        el.className = `status ${type}`;
    }
</script>
</body>
</html>
